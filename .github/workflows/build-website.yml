name: Build VRAMpage MD website bundle

# Builds only in the VRAMpage repository. NEVER publishes to McRetro.net.
on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ensure build dependencies
        shell: bash
        run: |
          task_missing_packages=()
          for task_tool in cmake python3 git make; do
            if ! command -v "$task_tool" >/dev/null 2>&1; then
              task_missing_packages+=("$task_tool")
            fi
          done
          if ((${#task_missing_packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${task_missing_packages[@]}"
          fi
          cmake --version
          python3 --version
          git --version
          make --version
      - name: Install Emscripten
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version
      - name: Run source checks and build browser core
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          test -f scripts/build-core.sh || { echo "Import v0.1 source first"; exit 1; }
          bash scripts/test.sh
          bash scripts/build-core.sh
          mkdir -p "$RUNNER_TEMP/normal-core"
          cp site/core/genplus.js site/core/genplus.wasm "$RUNNER_TEMP/normal-core/"
          test "$(sha256sum site/core/genplus.js | cut -d ' ' -f1)" = "3b984104bf92fd9e7a47fa5f081ed18d020e61dee6cd87df7580c147a3edc3bd"
          test "$(sha256sum site/core/genplus.wasm | cut -d ' ' -f1)" = "0bb55f946e5bb20ba0efc24e81776305ba8e1d9a82e0a3dcdca9e6218fbbe6d9"
          test -s site/core/genplus.js
          test -s site/core/genplus.wasm
          test -f site/source/README.txt
          bash scripts/build-core.sh site-runtime
          test -s site/core/genplus.js
          test -s site/core/genplus.wasm
          test -f site/source/runtime-profile/BUILDING.txt
          test -f site/source/runtime-profile/source/scripts/vram_transaction_api.js
          node tests/test_runtime_build_profile.cjs site/core/genplus.js
          node tests/test_wasm_logic.cjs site/core/genplus.js
      - name: Verify isolated RAM diagnostics with synthetic CPU tests
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 scripts/build-vblank-wait-diagnostic.py "$RUNNER_TEMP/vblank-wait"
          mkdir -p "$RUNNER_TEMP/vblank-wait/store-origin/wasm-genplus/build"
          (
            cd "$RUNNER_TEMP/vblank-wait/store-origin/wasm-genplus/build"
            emcmake cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            emmake make -j2
          )
          node tests/test_store_origin_wasm.cjs "$RUNNER_TEMP/vblank-wait/store-origin/wasm-genplus/src/main/js/genplus.js"
          node tests/test_vblank_wait_wasm.cjs "$RUNNER_TEMP/vblank-wait/store-origin/wasm-genplus/src/main/js/genplus.js"
      - name: Verify diagnostic VRAM transactions in actual WASM
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          test -d vendor/wasm-genplus/.git || { echo "Pinned vendor checkout is required for VRAM transaction tests" >&2; exit 1; }
          command -v emcmake >/dev/null
          command -v emmake >/dev/null
          command -v cmake >/dev/null
          command -v node >/dev/null
          VRAMPAGE_WASM_GENPLUS="$GITHUB_WORKSPACE/vendor/wasm-genplus" \
            python3 -m unittest tests.test_vram_transaction_wasm -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - name: Install actual-core browser test tools
        run: python3 -m pip install -r tests/requirements-browser.txt
      - name: Restore pinned browser binaries
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('tests/requirements-browser.txt') }}
      - name: Install system dependencies
        timeout-minutes: 6
        run: |
          bash scripts/prepare-browser-deps.sh
          python3 -m playwright install-deps chromium
      - name: Ensure pinned browser binaries
        run: python3 -m playwright install chromium
      - name: Save pinned browser binaries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Verify actual-core video, audio and controls
        run: python3 tests/browser_core.py --browser chromium
      - name: Verify actual runtime and legacy VRAM model handoffs
        run: python3 tests/browser_transaction.py --browser chromium --normal-core "$RUNNER_TEMP/normal-core"
      - name: Package static website with corresponding emulator source
        shell: bash
        run: |
          mkdir -p release
          cp -R site release/vrampage
          # Avoid extraneous Python or local build junk inside public artifact.
          find release/vrampage -type d -name '__pycache__' -prune -exec rm -rf '{}' +
          tar -czf release/VRAMpage-MD-static-site.tar.gz -C release vrampage
      - name: Package local review app with launcher
        run: python3 scripts/package-review.py --output release/VRAMpage-MD-v0.3.0-macos.zip
      - name: Upload ready-to-run local review app
        uses: actions/upload-artifact@v4
        with:
          name: VRAMpage-MD-local-review
          retention-days: 30
          path: release/VRAMpage-MD-v0.3.0-macos.zip
          if-no-files-found: error
      - name: Upload release bundle for manual McRetro staging
        uses: actions/upload-artifact@v4
        with:
          name: VRAMpage-MD-static-site
          retention-days: 30
          path: release/VRAMpage-MD-static-site.tar.gz
          if-no-files-found: error

  packaged-transaction-browsers:
    needs: build-site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - name: Install pinned browser test dependency
        run: python3 -m pip install -r tests/requirements-browser.txt
      - name: Restore pinned browser binaries
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('tests/requirements-browser.txt') }}
      - name: Install system dependencies
        timeout-minutes: 6
        run: |
          bash scripts/prepare-browser-deps.sh
          python3 -m playwright install-deps ${{ matrix.browser }}
      - name: Ensure pinned browser binaries
        run: python3 -m playwright install ${{ matrix.browser }}
      - name: Save pinned browser binaries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Download packaged local review app
        uses: actions/download-artifact@v4
        with:
          name: VRAMpage-MD-local-review
          path: ${{ runner.temp }}/packaged-review
      - name: Extract and verify packaged runtime and fallback cores
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/packaged-review" "$RUNNER_TEMP/extracted-review" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          archive_dir = Path(sys.argv[1])
          extract_dir = Path(sys.argv[2])
          archives = list(archive_dir.glob("VRAMpage-MD-*-macos.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one packaged review ZIP, found {len(archives)}")
          with zipfile.ZipFile(archives[0]) as package:
              package.extractall(extract_dir)
          project = extract_dir / "VRAMpage-MD"
          required = (
              project / "site/core/genplus.js",
              project / "site/core/genplus.wasm",
              project / "site/source/src/main/js/genplus.js",
              project / "site/source/src/main/js/genplus.wasm",
              project / "site/source/runtime-profile/BUILDING.txt",
          )
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Packaged site is missing runtime/fallback files:\n  " + "\n  ".join(missing))
          PY
      - name: Verify packaged runtime and normal fallback in ${{ matrix.browser }}
        run: |
          python3 tests/browser_transaction.py \
            --browser ${{ matrix.browser }} \
            --site-root "$RUNNER_TEMP/extracted-review/VRAMpage-MD/site" \
            --normal-core "$RUNNER_TEMP/extracted-review/VRAMpage-MD/site/source/src/main/js"
      - name: Provide native headless Firefox audio output
        if: matrix.browser == 'firefox'
        timeout-minutes: 6
        shell: bash
        run: |
          if ! command -v pulseaudio >/dev/null || ! command -v pactl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y pulseaudio pulseaudio-utils
          fi
          pulseaudio --start --exit-idle-time=-1
          pactl info
          pactl list short sinks
          pactl load-module module-null-sink sink_name=vrampage_ci rate=44100
          pactl set-default-sink vrampage_ci
          test "$(pactl get-default-sink)" = vrampage_ci
          pactl list short sinks
      - name: Verify packaged audio and controls in ${{ matrix.browser }}
        run: |
          python3 tests/browser_core.py \
            --browser ${{ matrix.browser }} \
            --site-root "$RUNNER_TEMP/extracted-review/VRAMpage-MD/site"
