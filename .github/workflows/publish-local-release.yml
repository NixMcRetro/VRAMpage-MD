name: Prepare v0.5.0 browser release draft

# Explicitly dispatched after main passes review. Only this repository is used.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-website.yml

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: VRAMpage-MD-local-review
          path: download
      - name: Check packaged commit and produce checksum
        run: |
          cd download
          python3 - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('VRAMpage-MD-v0.5.0-browser.zip') as bundle:
              root_info = bundle.read('VRAMpage-MD/BUILD-INFO.json')
              assert root_info == bundle.read('VRAMpage-MD/site/build-info.json')
              assert len(bundle.namelist()) == len(set(bundle.namelist()))
              info = json.loads(root_info)
              assert info['source_commit'] == os.environ['GITHUB_SHA'], info
              assert info['application_version'] == '0.5.0', info
          PY
          sha256sum VRAMpage-MD-v0.5.0-browser.zip > SHA256SUMS.txt
      - name: Attach the complete ZIP to the release draft
        run: |
          # Earlier canonical releases retain their original assets and notes.
          # The deleted legacy v2.4.0 retains only its source tag. See:
          # https://github.com/NixMcRetro/VRAMpage-MD/releases/tag/v0.2.4
          # Never replace assets or metadata of an already-public release.
          if gh release view v0.5.0 >/dev/null 2>&1 &&
             [ "$(gh release view v0.5.0 --json isDraft --jq '.isDraft')" = 'false' ]; then
            echo 'v0.5.0 is already public; publish a new version instead of replacing it.' >&2
            exit 1
          fi
          if ! gh release view v0.5.0 >/dev/null 2>&1; then
            gh release create v0.5.0 --draft --target "$GITHUB_SHA" --title 'VRAMpage MD v0.5.0' --notes-file docs/RELEASE-NOTES-v0.5.0.md
          fi
          # GitHub draft releases do not necessarily create a Git tag yet.
          # Create only an absent ref; never move or overwrite an existing tag.
          if ! gh api "repos/$GH_REPO/git/ref/tags/v0.5.0" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs" --method POST \
              -f ref=refs/tags/v0.5.0 -f sha="$GITHUB_SHA" >/dev/null
          fi
          # Resolve lightweight or annotated tags to the commit packaged above.
          tag_commit="$(gh api "repos/$GH_REPO/commits/v0.5.0" --jq '.sha')"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Release tag does not match packaged source: $tag_commit != $GITHUB_SHA" >&2
            exit 1
          fi
          gh release view v0.5.0 --json body --jq .body > /tmp/release-notes.md
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('/tmp/release-notes.md')
          lines = [line for line in p.read_text().splitlines()
                   if not line.startswith(('Source commit:', 'Release validation:'))]
          lines.extend(['', 'Source commit: `' + os.environ['GITHUB_SHA'] + '`.',
                        'Release validation: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']])
          p.write_text('\n'.join(lines) + '\n')
          PY
          gh release edit v0.5.0 --target "$GITHUB_SHA" --notes-file /tmp/release-notes.md
          gh release upload v0.5.0 download/VRAMpage-MD-v0.5.0-browser.zip download/SHA256SUMS.txt --clobber
          echo 'v0.5.0 draft prepared; publication remains a separate reviewed action.'
