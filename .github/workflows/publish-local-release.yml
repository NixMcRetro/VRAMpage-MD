name: Publish complete v0.2.5 local download

# Explicitly dispatched after main passes review. Only this repository is used.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-website.yml

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VRAMpage-MD-local-review
          path: download
      - name: Check packaged commit and produce checksum
        run: |
          cd download
          python3 - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('VRAMpage-MD-v0.2.5-macos.zip') as bundle:
              info = json.loads(bundle.read('VRAMpage-MD/BUILD-INFO.json'))
              assert info['source_commit'] == os.environ['GITHUB_SHA'], info
              assert info['application_version'] == '0.2.5', info
          PY
          sha256sum VRAMpage-MD-v0.2.5-macos.zip > SHA256SUMS.txt
      - name: Attach the complete ZIP and publish the release
        run: |
          # v0.2.4 and the superseded legacy v2.4.0 retain their original
          # tags/assets/notes. The v0.2.4 correction is documented at:
          # https://github.com/NixMcRetro/VRAMpage-MD/releases/tag/v0.2.4
          # Never replace assets or metadata of an already-public release.
          if gh release view v0.2.5 >/dev/null 2>&1 &&
             [ "$(gh release view v0.2.5 --json isDraft --jq '.isDraft')" = 'false' ]; then
            echo 'v0.2.5 is already public; publish a new version instead of replacing it.' >&2
            exit 1
          fi
          if ! gh release view v0.2.5 >/dev/null 2>&1; then
            gh release create v0.2.5 --draft --target "$GITHUB_SHA" --title 'VRAMpage MD v0.2.5 - ready-to-run Mac download' --notes 'Download the complete Mac ZIP below, extract it and open START.command. Python 3 is required. Load your own legally usable cartridge. See the included README and third-party non-commercial terms.'
          fi
          gh release view v0.2.5 --json body --jq .body > /tmp/release-notes.md
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('/tmp/release-notes.md')
          lines = [line for line in p.read_text().splitlines()
                   if not line.startswith(('Source commit:', 'Release validation:'))]
          lines.extend(['', 'Source commit: `' + os.environ['GITHUB_SHA'] + '`.',
                        'Release validation: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']])
          p.write_text('\n'.join(lines) + '\n')
          PY
          gh release edit v0.2.5 --target "$GITHUB_SHA" --notes-file /tmp/release-notes.md
          gh release upload v0.2.5 download/VRAMpage-MD-v0.2.5-macos.zip download/SHA256SUMS.txt --clobber
          gh release edit v0.2.5 --draft=false --latest
