name: VRAMpage MD source checks

on:
  push:
    branches: [main, 'import/**', 'feature/**', 'release/**', 'integration/**']
  pull_request:
  workflow_dispatch:
    inputs:
      review_bundle:
        description: Build a ready-to-run local review download
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  review-bundle:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.review_bundle)
    uses: ./.github/workflows/build-website.yml

  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify checked-in project source
        shell: bash
        run: |
          test -f scripts/test.sh || { echo "Source import not complete yet"; exit 0; }
          bash scripts/test.sh
      - name: Never commit commercial ROM or generated emulator
        shell: bash
        run: |
          if git ls-files -z | xargs -0 -r file | grep -Ei 'Sega Mega Drive ROM|Sega Genesis ROM'; then
            echo 'Potential ROM file found in tracked content'
            exit 1
          fi
          if git ls-files | grep -E '^vendor/|^site/source/|^site/core/genplus\.(js|wasm)$'; then
            echo 'Generated emulator/vendor output committed unexpectedly'
            exit 1
          fi

  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - name: Install pinned browser test dependency
        run: python -m pip install -r tests/requirements-browser.txt
      - name: Restore pinned browser binaries
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('tests/requirements-browser.txt') }}
      - name: Install system dependencies
        timeout-minutes: 6
        run: |
          bash scripts/prepare-browser-deps.sh
          python -m playwright install-deps ${{ matrix.browser }}
      - name: Ensure pinned browser binaries
        run: python -m playwright install ${{ matrix.browser }}
      - name: Save pinned browser binaries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Run ${{ matrix.browser }} layout and input tests
        run: python tests/browser_display.py --browser ${{ matrix.browser }} --artifacts artifacts/browser
      - name: Run ${{ matrix.browser }} logic interface tests
        run: python tests/browser_logic.py --browser ${{ matrix.browser }} --artifacts artifacts/browser-logic
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-display-${{ matrix.browser }}-screenshots
          path: |
            artifacts/browser/
            artifacts/browser-logic/
          if-no-files-found: warn
          retention-days: 14
