{
  "name": "Publish Approved VRAMpage MD v0.5.2",
  "on": {
    "push": {
      "branches": [
        "ops/publish-v0.5.2"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "publish-approved-v0.5.2",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": "github.repository == 'NixMcRetro/VRAMpage-MD' && github.ref == 'refs/heads/ops/publish-v0.5.2' && github.event_name == 'push'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "permissions": {
        "actions": "read",
        "contents": "write"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "GH_REPO": "NixMcRetro/VRAMpage-MD",
        "APPROVED_SOURCE_COMMIT": "bbb63443657fb96948ebec146ddbb1b00ba64b79",
        "APPROVED_SOURCE_RUN": "41070284563",
        "APPROVED_SOURCE_ZIP_SHA256": "9ba828dcbf47cd43b2c6a62b8a7ac4d236a4034f0d69961fff692950749a5584"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "ref": "bbb63443657fb96948ebec146ddbb1b00ba64b79",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify Approved Main and Required Checks",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(gh api \"repos/$GH_REPO/git/ref/heads/main\" --jq .object.sha)\" = \"$APPROVED_SOURCE_COMMIT\"\ngh api \"repos/$GH_REPO/actions/runs/$APPROVED_SOURCE_RUN\" > approved-run.json\ngh api \"repos/$GH_REPO/commits/$APPROVED_SOURCE_COMMIT/check-runs?per_page=100\" > approved-checks.json\ngh api \"repos/$GH_REPO/rulesets/26018111\" > approved-rules.json\ngh api \"repos/$GH_REPO/releases?per_page=100\" > releases-before.json\npython3 - <<'PY'\nimport json, os\nfrom pathlib import Path\nsha=os.environ['APPROVED_SOURCE_COMMIT']\nrun=json.loads(Path('approved-run.json').read_text())\nassert run['head_sha']==sha and run['head_branch']=='main'\nassert run['status']=='completed' and run['conclusion']=='success'\nassert run['path']=='.github/workflows/source-checks.yml'\nrules=json.loads(Path('approved-rules.json').read_text())\nassert rules['enforcement']=='active'\nrequired=next(r['parameters']['required_status_checks'] for r in rules['rules'] if r['type']=='required_status_checks')\nassert required\nchecks=json.loads(Path('approved-checks.json').read_text())\nassert checks['total_count']==len(checks['check_runs'])\nfor requirement in required:\n    found=[c for c in checks['check_runs'] if c['name']==requirement['context'] and (not requirement.get('integration_id') or c['app']['id']==requirement['integration_id'])]\n    assert found, requirement\n    assert all(c['head_sha']==sha and c['status']=='completed' and c['conclusion']=='success' for c in found), requirement\nfor name in ('Analyze (actions)','Analyze (python)','Analyze (c-cpp)','Analyze (javascript-typescript)'):\n    assert any(c['name']==name and c['app']['id']==15368 and c['head_sha']==sha and c['status']=='completed' and c['conclusion']=='success' for c in checks['check_runs']), name\nassert Path('VERSION').read_text().strip()=='0.5.2'\nreleases=json.loads(Path('releases-before.json').read_text())\nassert len(releases)<100\nassert all(r['tag_name']!='v0.5.2' for r in releases), 'Never replace an existing release'\nprint('Approved main, protected checks, CodeQL and preservation gates passed')\nPY"
        },
        {
          "name": "Download Verified Main Artifacts",
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir download\ngh run download \"$APPROVED_SOURCE_RUN\" --repo \"$GH_REPO\" --name VRAMpage-MD-local-review --dir download\ngh run download \"$APPROVED_SOURCE_RUN\" --repo \"$GH_REPO\" --name VRAMpage-MD-corresponding-source --dir download"
        },
        {
          "name": "Verify Source, Runtime, ROMs and Checksums",
          "shell": "bash",
          "run": "cd download\npython3 - <<'PY'\nimport json, os, zipfile\nwith zipfile.ZipFile('VRAMpage-MD-v0.5.2-browser.zip') as bundle:\n    root_info = bundle.read('VRAMpage-MD/BUILD-INFO.json')\n    assert root_info == bundle.read('VRAMpage-MD/site/build-info.json')\n    assert len(bundle.namelist()) == len(set(bundle.namelist()))\n    info = json.loads(root_info)\n    bundle_bytes = {name: bundle.read('VRAMpage-MD/site/core/' + name) for name in ('genplus.js', 'genplus.wasm')}\n    assert info['source_commit'] == os.environ['APPROVED_SOURCE_COMMIT'], info\n    assert info['application_version'] == '0.5.2', info\nwith zipfile.ZipFile('VRAMpage-MD-v0.5.2-corresponding-source.zip') as sources:\n    source_info = json.loads(sources.read('SOURCE-INFO.json'))\n    assert source_info['source_commit'] == os.environ['APPROVED_SOURCE_COMMIT'], source_info\n    assert source_info['version'] == '0.5.2', source_info\n    import hashlib\n    for name, digest in source_info['core_sha256'].items():\n        assert hashlib.sha256(bundle_bytes[name]).hexdigest() == digest\nPY\nsha256sum -c SHA256SUMS.txt\ntest \"$(sha256sum VRAMpage-MD-v0.5.2-corresponding-source.zip | cut -d ' ' -f1)\" = \"$APPROVED_SOURCE_ZIP_SHA256\"\ncd \"$GITHUB_WORKSPACE\"\npython3 - <<'PY'\nimport json, sys, zipfile\nfrom pathlib import Path, PurePosixPath\nsys.path.insert(0,str(Path('scripts').resolve()))\nfrom cartridges import approved_assets, load_manifest, verify_asset\nmanifest=load_manifest()\nassets=approved_assets(manifest)\nwith zipfile.ZipFile('download/VRAMpage-MD-v0.5.2-browser.zip') as bundle:\n    assert json.loads(bundle.read('VRAMpage-MD/site/cartridges.json'))==manifest\n    for relative in assets:\n        verify_asset(relative,bundle.read('VRAMpage-MD/'+relative),assets)\n    for name in bundle.namelist():\n        assert name.startswith('VRAMpage-MD/') and '..' not in PurePosixPath(name).parts\n        if not name.endswith('/'):\n            verify_asset(name.removeprefix('VRAMpage-MD/'),bundle.read(name),assets)\nprint('All bundled cartridges and preserved assets match the authoritative manifest; no unknown ROMs')\nPY"
        },
        {
          "name": "Prepare New Release Draft",
          "shell": "bash",
          "run": "# Earlier canonical releases retain their original assets and notes.\n# The deleted legacy v2.4.0 retains only its source tag. See:\n# https://github.com/NixMcRetro/VRAMpage-MD/releases/tag/v0.2.4\n# Never replace assets or metadata of an already-public release.\nif gh release view v0.5.2 >/dev/null 2>&1 &&\n   [ \"$(gh release view v0.5.2 --json isDraft --jq '.isDraft')\" = 'false' ]; then\n  echo 'v0.5.2 is already public; publish a new version instead of replacing it.' >&2\n  exit 1\nfi\nif ! gh release view v0.5.2 >/dev/null 2>&1; then\n  gh release create v0.5.2 --draft --target \"$APPROVED_SOURCE_COMMIT\" --title 'VRAMpage MD v0.5.2' --notes-file docs/RELEASE-NOTES-v0.5.2.md\nfi\n# GitHub draft releases do not necessarily create a Git tag yet.\n# Create only an absent ref; never move or overwrite an existing tag.\nif ! gh api \"repos/$GH_REPO/git/ref/tags/v0.5.2\" >/dev/null 2>&1; then\n  gh api \"repos/$GH_REPO/git/refs\" --method POST \\\n    -f ref=refs/tags/v0.5.2 -f sha=\"$APPROVED_SOURCE_COMMIT\" >/dev/null\nfi\n# Resolve lightweight or annotated tags to the commit packaged above.\ntag_commit=\"$(gh api \"repos/$GH_REPO/commits/v0.5.2\" --jq '.sha')\"\nif [ \"$tag_commit\" != \"$APPROVED_SOURCE_COMMIT\" ]; then\n  echo \"Release tag does not match packaged source: $tag_commit != $APPROVED_SOURCE_COMMIT\" >&2\n  exit 1\nfi\ngh release view v0.5.2 --json body --jq .body > /tmp/release-notes.md\npython3 - <<'PY'\nimport os\nfrom pathlib import Path\np = Path('/tmp/release-notes.md')\nlines = [line for line in p.read_text().splitlines()\n         if not line.startswith(('Source commit:', 'Release validation:'))]\nlines.extend(['', 'Source commit: `' + os.environ['APPROVED_SOURCE_COMMIT'] + '`.',\n              'Release validation: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']])\np.write_text('\\n'.join(lines) + '\\n')\nPY\ngh release edit v0.5.2 --target \"$APPROVED_SOURCE_COMMIT\" --notes-file /tmp/release-notes.md\ngh release upload v0.5.2 download/VRAMpage-MD-v0.5.2-browser.zip download/VRAMpage-MD-v0.5.2-corresponding-source.zip download/SHA256SUMS.txt\necho 'v0.5.2 draft prepared; publication remains a separate reviewed action.'"
        },
        {
          "name": "Verify Uploaded Assets and Publish Approved Release",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(gh api \"repos/$GH_REPO/git/ref/heads/main\" --jq .object.sha)\" = \"$APPROVED_SOURCE_COMMIT\"\ntest \"$(gh api \"repos/$GH_REPO/commits/v0.5.2\" --jq .sha)\" = \"$APPROVED_SOURCE_COMMIT\"\ngh api \"repos/$GH_REPO/releases/tags/v0.5.2\" > prepared-release.json\npython3 - <<'PY'\nimport hashlib, json\nfrom pathlib import Path\nrelease=json.loads(Path('prepared-release.json').read_text())\nassert release['draft'] is True and release['prerelease'] is False\nassert release['tag_name']=='v0.5.2' and release['name']=='VRAMpage MD v0.5.2'\nnames={'VRAMpage-MD-v0.5.2-browser.zip','VRAMpage-MD-v0.5.2-corresponding-source.zip','SHA256SUMS.txt'}\nassert {a['name'] for a in release['assets']}==names\nfor asset in release['assets']:\n    data=(Path('download')/asset['name']).read_bytes()\n    assert asset['size']==len(data)\n    assert asset['digest']=='sha256:'+hashlib.sha256(data).hexdigest(), asset['name']\nprint('Uploaded release asset digests verified')\nPY\ngh release edit v0.5.2 --draft=false --latest\ngh api \"repos/$GH_REPO/releases?per_page=100\" > releases-after.json\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nbefore=json.loads(Path('releases-before.json').read_text())\nafter=json.loads(Path('releases-after.json').read_text())\nby_id={r['id']:r for r in after}\ndef identity(r):\n    keys=('id','tag_name','name','body','target_commitish','draft','prerelease','published_at')\n    return {**{k:r[k] for k in keys},'assets':sorted(({k:a[k] for k in ('id','name','size','digest')} for a in r['assets']),key=lambda a:a['id'])}\nfor release in before:\n    assert release['id'] in by_id\n    assert identity(release)==identity(by_id[release['id']]), release['tag_name']\npublished=next(r for r in after if r['tag_name']=='v0.5.2')\nassert published['draft'] is False and published['published_at']\nassert published['name']=='VRAMpage MD v0.5.2'\nprint('Published '+published['html_url']+'; all previous release assets and metadata preserved')\nPY"
        }
      ]
    }
  }
}
